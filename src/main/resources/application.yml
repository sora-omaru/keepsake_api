spring:
  application:
    name: keepsake-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15433/keepsake}
    username: ${SPRING_DATASOURCE_USERNAME:keepsake_user}
    password: ${SPRING_DATASOURCE_PASSWORD:keepsake_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true