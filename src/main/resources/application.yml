spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
  application:
    name: keepsake-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15433/keepsake}
    username: ${SPRING_DATASOURCE_USERNAME:keepsake_user}
    password: ${SPRING_DATASOURCE_PASSWORD:keepsake_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

app:
  cors:
    # 本番ではデプロイしたフロントのURLをCORS_ALLOWED_ORIGINSに設定する。
    # 複数指定するときはカンマ区切りにする。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
